<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/webp" sizes="32x32" href="/asiaray-logo-leve.webp?v=1" />
    <link rel="icon" type="image/webp" sizes="16x16" href="/asiaray-logo-leve.webp?v=1" />
    <link rel="shortcut icon" href="/asiaray-logo-leve.webp?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/asiaray-logo-leve.webp?v=1" />
    <title>Asiaray</title>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root">
      <!-- Spinner global de carregamento inicial -->
      <div id="initial-global-loader" style="position: fixed; inset: 0; z-index: 10001; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background-color: #ffffff; user-select: none; pointer-events: auto;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
          <div style="width: 40px; height: 40px; border: 3px solid rgba(37, 99, 235, 0.15); border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 0.5s linear infinite;"></div>
          <span style="font-size: 14px; font-weight: 500; color: #2563eb;">Carregando...</span>
        </div>
      </div>
      <style>
        @keyframes initial-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
