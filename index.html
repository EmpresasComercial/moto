<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/webp" sizes="32x32" href="/asiaray-logo-leve.webp?v=1" />
    <link rel="icon" type="image/webp" sizes="16x16" href="/asiaray-logo-leve.webp?v=1" />
    <link rel="shortcut icon" href="/asiaray-logo-leve.webp?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/asiaray-logo-leve.webp?v=1" />
    <title>Asiaray</title>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root">
      <!-- Spinner global de carregamento inicial -->
      <div id="initial-global-loader" style="position: fixed; inset: 0; z-index: 10001; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background-color: #ffffff; user-select: none; pointer-events: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 320px; width: 100%; gap: 40px;">
          <!-- Slideshow de Instruções -->
          <div style="position: relative; height: 100px; width: 100%; display: flex; align-items: center; justify-content: center;">
            <div id="loader-slide-1" class="loader-slide" style="position: absolute; width: 100%; text-align: center; font-size: 15px; line-height: 1.6; color: #334155; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 1; transform: translateY(0);">
              Número válido de Angola vinculado ao <strong style="color: #2563eb;">WhatsApp</strong>.
            </div>
            <div id="loader-slide-2" class="loader-slide" style="position: absolute; width: 100%; text-align: center; font-size: 15px; line-height: 1.6; color: #334155; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 0; transform: translateY(12px);">
              Senha segura de no mínimo <strong style="color: #2563eb;">6 dígitos</strong>.
            </div>
            <div id="loader-slide-3" class="loader-slide" style="position: absolute; width: 100%; text-align: center; font-size: 15px; line-height: 1.6; color: #334155; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 0; transform: translateY(12px);">
              Código de convite e clique em <strong style="color: #2563eb;">Cadastrar</strong>.
            </div>
          </div>

          <!-- Spinner & Wait -->
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
            <div style="width: 38px; height: 38px; border: 3px solid rgba(37, 99, 235, 0.15); border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 0.6s linear infinite;"></div>
            <span style="font-size: 13px; font-weight: 500; color: #2563eb; letter-spacing: 0.05em;">Wait...</span>
          </div>
        </div>

        <script>
          (function() {
            var slides = document.querySelectorAll('.loader-slide');
            var currentSlide = 0;
            if (slides.length > 0) {
              setInterval(function() {
                var active = slides[currentSlide];
                active.style.opacity = '0';
                active.style.transform = 'translateY(-12px)';
                
                currentSlide = (currentSlide + 1) % slides.length;
                
                var next = slides[currentSlide];
                setTimeout(function() {
                  next.style.opacity = '1';
                  next.style.transform = 'translateY(0)';
                }, 50);
              }, 3200);
            }
          })();
        </script>
      </div>
      <style>
        @keyframes initial-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
