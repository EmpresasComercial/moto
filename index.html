<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.asiaarys.png?v=1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.asiaarys.png?v=1" />
    <link rel="shortcut icon" href="/logo.asiaarys.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.asiaarys.png?v=1" />
    <title>Asiaray</title>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root">
      <!-- Spinner global de carregamento inicial -->
      <div id="initial-global-loader" style="position: fixed; inset: 0; z-index: 10001; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); user-select: none; pointer-events: auto;">
        <div style="background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 16px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.5); display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 210px; width: 100%; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <div style="width: 40px; height: 40px; border: 3px solid rgba(220, 38, 38, 0.15); border-top-color: #dc2626; border-radius: 50%; animation: initial-spin 1s linear infinite;"></div>
            <span style="font-size: 14px; font-weight: 300; color: #1e293b; margin-top: 8px;">Wait...</span>
          </div>
        </div>
      </div>
      <style>
        @keyframes initial-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
